[package]
name = "request-pilot-desktop"
version = "0.1.0"
edition = "2021"
description = "Request Pilot — a developer HTTP client"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
request-pilot-core = { path = "../../core" }
tokio-tungstenite = "0.24"
futures-util = "0.3"
