<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="body" x1="30" y1="40" x2="90" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="26" fill="url(#bg)"/>

  <!-- Stars -->
  <circle cx="14" cy="16" r="1.2" fill="#fff" opacity=".6"/>
  <circle cx="108" cy="14" r="1" fill="#fff" opacity=".45"/>
  <circle cx="10" cy="64" r="0.9" fill="#fff" opacity=".35"/>
  <circle cx="120" cy="58" r="1" fill="#fff" opacity=".4"/>
  <circle cx="22" cy="112" r="0.8" fill="#fff" opacity=".3"/>
  <circle cx="106" cy="106" r="1.1" fill="#fff" opacity=".35"/>
  <circle cx="50" cy="10" r="0.7" fill="#fff" opacity=".5"/>
  <circle cx="90" cy="24" r="0.6" fill="#fff" opacity=".3"/>
  <circle cx="118" cy="86" r="0.8" fill="#fff" opacity=".3"/>
  <circle cx="30" cy="42" r="0.7" fill="#fff" opacity=".4"/>

  <!-- Multiple trajectory arcs — fanning out behind the plane -->
  <path d="M58 62 Q40 50 14 20" stroke="#f97316" stroke-width="2" fill="none" stroke-linecap="round" opacity=".6"/>
  <path d="M56 66 Q36 62 10 52" stroke="#a78bfa" stroke-width="2" fill="none" stroke-linecap="round" opacity=".5"/>
  <path d="M56 70 Q38 76 12 86" stroke="#22d3ee" stroke-width="2" fill="none" stroke-linecap="round" opacity=".45"/>
  <path d="M56 74 Q40 88 20 110" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round" opacity=".4"/>
  <path d="M58 68 Q34 68 8 68" stroke="#818cf8" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".35"/>

  <!-- Destination markers -->
  <circle cx="14" cy="20" r="2.5" fill="#f97316" opacity=".55"/>
  <circle cx="10" cy="52" r="2.5" fill="#a78bfa" opacity=".45"/>
  <circle cx="8" cy="68" r="2.5" fill="#818cf8" opacity=".4"/>
  <circle cx="12" cy="86" r="2.5" fill="#22d3ee" opacity=".4"/>
  <circle cx="20" cy="110" r="2.5" fill="#34d399" opacity=".4"/>

  <!-- Airplane — clean side-profile, flying right → -->
  <!-- Fuselage -->
  <ellipse cx="78" cy="68" rx="28" ry="8" fill="url(#body)"/>
  <!-- Nose -->
  <path d="M106 68 Q114 68 108 66 Q106 65 106 68Z" fill="#e2e8f0"/>
  <path d="M106 68 Q114 68 108 70 Q106 71 106 68Z" fill="#cbd5e1"/>
  <!-- Cockpit window -->
  <path d="M100 64 Q104 62 106 64 Q106 66 102 66Z" fill="#0ea5e9" opacity=".7"/>
  <path d="M101 64.5 Q103 63 104.5 64.5" fill="#38bdf8" opacity=".3"/>
  <!-- Passenger windows -->
  <circle cx="94" cy="65.5" r="1.3" fill="#1e3a5f" opacity=".6"/>
  <circle cx="89" cy="65.5" r="1.3" fill="#1e3a5f" opacity=".6"/>
  <circle cx="84" cy="65.5" r="1.3" fill="#1e3a5f" opacity=".6"/>
  <circle cx="79" cy="65.5" r="1.3" fill="#1e3a5f" opacity=".6"/>
  <circle cx="74" cy="65.5" r="1.3" fill="#1e3a5f" opacity=".5"/>
  <!-- Main wing -->
  <path d="M72 68 L60 82 L64 82 L82 68Z" fill="#6366f1"/>
  <path d="M72 68 L60 54 L64 54 L82 68Z" fill="#6366f1"/>
  <!-- Wing highlights -->
  <path d="M72 68 L62 80 L64 80 L80 68Z" fill="#818cf8" opacity=".3"/>
  <path d="M72 68 L62 56 L64 56 L80 68Z" fill="#818cf8" opacity=".3"/>
  <!-- Tail vertical stabilizer -->
  <path d="M52 68 L48 48 L54 48 L56 68Z" fill="#6366f1"/>
  <path d="M52 68 L50 50 L54 50 L55 68Z" fill="#818cf8" opacity=".3"/>
  <!-- Tail horizontal stabilizer -->
  <path d="M50 68 L44 74 L48 74 L54 68Z" fill="#6366f1" opacity=".8"/>
  <path d="M50 68 L44 62 L48 62 L54 68Z" fill="#6366f1" opacity=".8"/>
  <!-- Engine under wing -->
  <ellipse cx="70" cy="76" rx="5" ry="2.5" fill="#94a3b8"/>
  <ellipse cx="70" cy="76" rx="4" ry="2" fill="#cbd5e1"/>
  <!-- Engine glow -->
  <ellipse cx="65" cy="76" rx="3" ry="1.5" fill="#fbbf24" opacity=".4"/>

  <!-- Speed lines -->
  <line x1="40" y1="64" x2="32" y2="64" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".2"/>
  <line x1="42" y1="72" x2="36" y2="72" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".15"/>
  <line x1="44" y1="56" x2="38" y2="56" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity=".12"/>
</svg>
