<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="rocket-body" x1="64" y1="18" x2="64" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="flame" x1="64" y1="95" x2="64" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Cosmos background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Stars -->
  <circle cx="18" cy="22" r="1.2" fill="#fff" opacity=".7"/>
  <circle cx="108" cy="16" r="1" fill="#fff" opacity=".5"/>
  <circle cx="14" cy="68" r="0.8" fill="#fff" opacity=".4"/>
  <circle cx="112" cy="72" r="1.1" fill="#fff" opacity=".6"/>
  <circle cx="26" cy="108" r="0.9" fill="#fff" opacity=".3"/>
  <circle cx="100" cy="104" r="1.3" fill="#fff" opacity=".5"/>
  <circle cx="40" cy="14" r="0.7" fill="#fff" opacity=".6"/>
  <circle cx="88" cy="42" r="0.6" fill="#fff" opacity=".35"/>
  <circle cx="22" cy="46" r="1" fill="#fff" opacity=".45"/>
  <circle cx="104" cy="52" r="0.8" fill="#fff" opacity=".3"/>
  <!-- Flame / thrust -->
  <path d="M56 96Q52 110 50 120Q58 112 64 118Q70 112 78 120Q76 110 72 96Z" fill="url(#flame)" opacity=".9"/>
  <path d="M58 96Q56 106 55 112Q60 107 64 110Q68 107 73 112Q72 106 70 96Z" fill="#fde68a" opacity=".7"/>
  <!-- Rocket body -->
  <path d="M64 18C54 18 48 38 48 62V88C48 92 52 96 56 96H72C76 96 80 92 80 88V62C80 38 74 18 64 18Z" fill="url(#rocket-body)"/>
  <!-- Nose cone accent -->
  <path d="M64 18C58 18 53 30 51 42H77C75 30 70 18 64 18Z" fill="#e2e8f0"/>
  <!-- Window / cockpit — pilot visible -->
  <ellipse cx="64" cy="54" rx="10" ry="11" fill="#1e3a5f"/>
  <ellipse cx="64" cy="54" rx="9" ry="10" fill="#0ea5e9" opacity=".3"/>
  <!-- Pilot head -->
  <circle cx="64" cy="51" r="5" fill="#fcd34d"/>
  <!-- Pilot visor -->
  <path d="M59.5 49.5Q64 47 68.5 49.5Q68.5 53 64 54Q59.5 53 59.5 49.5Z" fill="#38bdf8" opacity=".8"/>
  <!-- Pilot body hint -->
  <ellipse cx="64" cy="58" rx="4" ry="3" fill="#f97316" opacity=".7"/>
  <!-- Window glint -->
  <ellipse cx="60" cy="50" rx="2" ry="1.5" fill="#fff" opacity=".3" transform="rotate(-20 60 50)"/>
  <!-- Side fins -->
  <path d="M48 78L36 94L48 90Z" fill="#6366f1"/>
  <path d="M80 78L92 94L80 90Z" fill="#6366f1"/>
  <!-- Center stripe -->
  <rect x="60" y="70" width="8" height="16" rx="2" fill="#6366f1" opacity=".5"/>
  <!-- Speed lines -->
  <line x1="30" y1="34" x2="30" y2="44" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".2"/>
  <line x1="98" y1="30" x2="98" y2="38" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".15"/>
  <line x1="36" y1="80" x2="36" y2="90" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity=".15"/>
  <line x1="92" y1="76" x2="92" y2="84" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity=".12"/>
</svg>
