[package]
name = "request-pilot-cli"
version = "0.1.0"
edition = "2021"
description = "Request Pilot CLI — command-line interface for HTTP testing"

[lib]
name = "request_pilot_cli"
path = "src/lib.rs"

[[bin]]
name = "request-pilot"
path = "src/main.rs"

[dependencies]
request-pilot-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }
humantime = "2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
