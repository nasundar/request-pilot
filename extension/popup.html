<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RequestPilot</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body data-theme="dark">

  <!-- HEADER -->
  <header class="app-header">
    <div class="brand">
      <svg class="logo logo-dark" width="28" height="28" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="rp-bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient>
          <linearGradient id="rp-rb" x1="64" y1="18" x2="64" y2="100" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient>
          <linearGradient id="rp-fl" x1="64" y1="95" x2="64" y2="118" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#f97316"/><stop offset="40%" stop-color="#ef4444"/><stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/></linearGradient>
        </defs>
        <rect width="128" height="128" rx="28" fill="url(#rp-bg)"/>
        <circle cx="18" cy="22" r="1.2" fill="#fff" opacity=".7"/><circle cx="108" cy="16" r="1" fill="#fff" opacity=".5"/><circle cx="14" cy="68" r=".8" fill="#fff" opacity=".4"/><circle cx="112" cy="72" r="1.1" fill="#fff" opacity=".6"/><circle cx="100" cy="104" r="1.3" fill="#fff" opacity=".5"/>
        <path d="M56 96Q52 110 50 120Q58 112 64 118Q70 112 78 120Q76 110 72 96Z" fill="url(#rp-fl)" opacity=".9"/>
        <path d="M58 96Q56 106 55 112Q60 107 64 110Q68 107 73 112Q72 106 70 96Z" fill="#fde68a" opacity=".7"/>
        <path d="M64 18C54 18 48 38 48 62V88C48 92 52 96 56 96H72C76 96 80 92 80 88V62C80 38 74 18 64 18Z" fill="url(#rp-rb)"/>
        <path d="M64 18C58 18 53 30 51 42H77C75 30 70 18 64 18Z" fill="#e2e8f0"/>
        <ellipse cx="64" cy="54" rx="10" ry="11" fill="#1e3a5f"/><ellipse cx="64" cy="54" rx="9" ry="10" fill="#0ea5e9" opacity=".3"/>
        <circle cx="64" cy="51" r="5" fill="#fcd34d"/>
        <path d="M59.5 49.5Q64 47 68.5 49.5Q68.5 53 64 54Q59.5 53 59.5 49.5Z" fill="#38bdf8" opacity=".8"/>
        <ellipse cx="64" cy="58" rx="4" ry="3" fill="#f97316" opacity=".7"/>
        <path d="M48 78L36 94L48 90Z" fill="#6366f1"/><path d="M80 78L92 94L80 90Z" fill="#6366f1"/>
        <rect x="60" y="70" width="8" height="16" rx="2" fill="#6366f1" opacity=".5"/>
      </svg>
      <svg class="logo logo-light" width="28" height="28" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="rp-bg-l" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#c8cce0"/><stop offset="100%" stop-color="#b0b4d0"/></linearGradient>
          <linearGradient id="rp-rb-l" x1="64" y1="18" x2="64" y2="100" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#a8b0c0"/></linearGradient>
          <linearGradient id="rp-fl-l" x1="64" y1="95" x2="64" y2="118" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#d06010"/><stop offset="40%" stop-color="#c03030"/><stop offset="100%" stop-color="#c08818" stop-opacity="0"/></linearGradient>
        </defs>
        <rect width="128" height="128" rx="28" fill="url(#rp-bg-l)"/>
        <circle cx="18" cy="22" r="1.2" fill="#687090" opacity=".6"/><circle cx="108" cy="16" r="1" fill="#687090" opacity=".5"/><circle cx="14" cy="68" r=".8" fill="#687090" opacity=".4"/><circle cx="112" cy="72" r="1.1" fill="#6870900" opacity=".5"/><circle cx="100" cy="104" r="1.3" fill="#6870900" opacity=".45"/>
        <path d="M56 96Q52 110 50 120Q58 112 64 118Q70 112 78 120Q76 110 72 96Z" fill="url(#rp-fl-l)" opacity=".9"/>
        <path d="M58 96Q56 106 55 112Q60 107 64 110Q68 107 73 112Q72 106 70 96Z" fill="#c8a040" opacity=".7"/>
        <path d="M64 18C54 18 48 38 48 62V88C48 92 52 96 56 96H72C76 96 80 92 80 88V62C80 38 74 18 64 18Z" fill="url(#rp-rb-l)"/>
        <path d="M64 18C58 18 53 30 51 42H77C75 30 70 18 64 18Z" fill="#c8ccd8"/>
        <ellipse cx="64" cy="54" rx="10" ry="11" fill="#2a3858"/><ellipse cx="64" cy="54" rx="9" ry="10" fill="#3878a8" opacity=".3"/>
        <circle cx="64" cy="51" r="5" fill="#c09020"/>
        <path d="M59.5 49.5Q64 47 68.5 49.5Q68.5 53 64 54Q59.5 53 59.5 49.5Z" fill="#3888b8" opacity=".75"/>
        <ellipse cx="64" cy="58" rx="4" ry="3" fill="#c06018" opacity=".7"/>
        <path d="M48 78L36 94L48 90Z" fill="#4448a8"/><path d="M80 78L92 94L80 90Z" fill="#4448a8"/>
        <rect x="60" y="70" width="8" height="16" rx="2" fill="#4448a8" opacity=".5"/>
      </svg>
      <h1>RequestPilot</h1>
    </div>
    <div class="btn-group">
      <button class="popout-btn" id="btn-popout" title="Open in new tab (resizable)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      </button>
      <button class="theme-toggle" id="btn-theme" title="Toggle light/dark theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button class="btn-icon" id="btn-import" title="Import rules">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" y1="3" x2="12" y2="15" />
        </svg>
      </button>
      <button class="btn-icon" id="btn-export" title="Export rules">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
      </button>
      <button class="btn btn-primary" id="btn-add">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        Add Rule
      </button>
    </div>
    <input type="file" id="file-import" accept=".json" class="hidden" />
  </header>

  <!-- Desktop Connection Status -->
  <div class="desktop-status-bar" id="desktopStatusBar">
    <span class="desktop-dot" id="desktopDot"></span>
    <span class="desktop-status-text" id="desktopStatusText">Desktop: Disabled</span>
    <span class="desktop-mode-label" id="desktopModeLabel"></span>
    <label class="live-toggle" title="Enable/disable desktop live capture connection">
      <input type="checkbox" id="liveToggle" />
      <span class="live-toggle-slider"></span>
    </label>
  </div>

  <!-- TABS -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="rules">Rules</button>
    <button class="tab-btn" data-tab="log">Filtered Log</button>
    <button class="tab-btn" data-tab="stats">Stats</button>
  </nav>

  <!-- RULES TAB CONTENT -->
  <section id="tab-rules" class="tab-content active">
    <main id="rules-container"></main>
    <div id="empty-state" class="empty-state hidden">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
        <line x1="12" y1="8" x2="12" y2="16" />
        <line x1="8" y1="12" x2="16" y2="12" />
      </svg>
      <p>No rules yet.</p>
      <p class="sub">Click <strong>Add Rule</strong> to get started.</p>
    </div>
  </section>

  <!-- LOG TAB CONTENT -->
  <section id="tab-log" class="tab-content hidden">
    <div class="log-header">
      <h2>Network Log <span id="log-count" class="log-count"></span></h2>
      <div class="log-actions">
        <span id="selection-count" class="selection-count hidden">0 selected</span>
        <button id="btn-compare" class="btn btn-primary btn-sm hidden">Compare</button>
        <button id="btn-pause-log"class="btn btn-ghost btn-sm" title="Pause logging">⏸ Pause</button>
        <button id="btn-export-log" class="btn btn-ghost btn-sm" title="Export log">↓ Export</button>
        <button id="btn-import-log" class="btn btn-ghost btn-sm" title="Import log">↑ Import</button>
        <button id="btn-clear-log" class="btn btn-ghost btn-sm">Clear</button>
        <input type="file" id="file-import-log" accept=".json,.har" class="hidden" />
      </div>
    </div>
    <div class="log-filters">
      <div class="filter-group">
        <label class="filter-label">Rules:</label>
        <div class="key-picker-wrapper">
          <button id="btn-rule-picker" class="filter-select key-picker-btn">All rules ▾</button>
          <div id="rule-picker-dropdown" class="key-picker-dropdown hidden">
            <div class="key-picker-actions">
              <button id="btn-rules-all" class="btn btn-ghost btn-sm">Select All</button>
              <button id="btn-rules-none" class="btn btn-ghost btn-sm">Deselect All</button>
            </div>
            <div id="rule-picker-list" class="key-picker-list"></div>
          </div>
        </div>
      </div>
      <div class="filter-group">
        <label class="filter-label">Method:</label>
        <select id="filter-method" class="filter-select">
          <option value="">All</option>
          <option value="GET">GET</option>
          <option value="POST">POST</option>
          <option value="PUT">PUT</option>
          <option value="DELETE">DELETE</option>
          <option value="PATCH">PATCH</option>
          <option value="OPTIONS">OPTIONS</option>
          <option value="HEAD">HEAD</option>
        </select>
      </div>
      <div class="filter-group">
        <label class="filter-label">Status:</label>
        <select id="filter-status" class="filter-select">
          <option value="">All</option>
          <option value="2xx">2xx Success</option>
          <option value="3xx">3xx Redirect</option>
          <option value="4xx">4xx Client Error</option>
          <option value="5xx">5xx Server Error</option>
          <option value="err">Error</option>
        </select>
      </div>
      <div class="filter-group">
        <label class="filter-label">Match Keys:</label>
        <div class="key-picker-wrapper">
          <button id="btn-key-picker" class="filter-select key-picker-btn">All keys ▾</button>
          <div id="key-picker-dropdown" class="key-picker-dropdown hidden">
            <div class="key-picker-actions">
              <button id="btn-keys-all" class="btn btn-ghost btn-sm">Select All</button>
              <button id="btn-keys-none" class="btn btn-ghost btn-sm">Deselect All</button>
            </div>
            <div id="key-picker-list" class="key-picker-list">
              <!-- populated dynamically -->
            </div>
          </div>
        </div>
      </div>
      <div class="filter-group">
        <label class="filter-label">Min Match:</label>
        <select id="filter-similarity" class="filter-select">
          <option value="0">All</option>
          <option value="50">≥ 50%</option>
          <option value="60">≥ 60%</option>
          <option value="70">≥ 70%</option>
          <option value="80">≥ 80%</option>
          <option value="90">≥ 90%</option>
          <option value="100">100%</option>
        </select>
      </div>
      <div class="filter-group">
        <label class="filter-label">Show Headers:</label>
        <div class="key-picker-wrapper">
          <button id="btn-display-headers" class="filter-select key-picker-btn">None ▾</button>
          <div id="display-headers-dropdown" class="key-picker-dropdown hidden">
            <div class="key-picker-actions">
              <button id="btn-dh-all" class="btn btn-ghost btn-sm">Select All</button>
              <button id="btn-dh-none" class="btn btn-ghost btn-sm">Deselect All</button>
            </div>
            <div id="display-headers-list" class="key-picker-list">
              <!-- populated dynamically -->
            </div>
          </div>
        </div>
      </div>
      <div class="filter-group">
        <label class="filter-label">Group By:</label>
        <select id="group-by-header" class="filter-select">
          <option value="">None</option>
          <option value="url">URL</option>
          <!-- populated dynamically -->
        </select>
      </div>
      <div class="filter-group">
        <label class="method-chip" style="margin:0;font-size:11px;">
          <input type="checkbox" id="hide-url" /> Hide URL
        </label>
      </div>
    </div>
    <div id="log-container"></div>
    <div id="log-empty"class="empty-state hidden">
      <p>No network requests captured yet.</p>
      <p class="sub">Requests will appear here as you browse.</p>
    </div>
  </section>

  <!-- STATS TAB CONTENT -->
  <section id="tab-stats" class="tab-content hidden">
    <div id="stats-content"></div>
  </section>

  <!-- MODAL -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="modal-title">Add Rule</h2>
      <form id="rule-form" autocomplete="off">

        <!-- Rule Type -->
        <label>Rule Type</label>
        <div id="type-selector" class="type-selector">
          <button type="button" class="type-btn active" data-type="modify-headers">Modify Headers</button>
          <button type="button" class="type-btn" data-type="block">Block</button>
          <button type="button" class="type-btn" data-type="redirect">Redirect</button>
          <button type="button" class="type-btn" data-type="forward">Forward Only</button>
        </div>
        <input type="hidden" id="input-type" value="modify-headers" />

        <!-- URL Pattern -->
        <label for="input-url">URL Pattern</label>
        <input id="input-url" type="text" placeholder="e.g. https://api.example.com/*" required />
        <p class="hint">Supports <code>*</code> wildcards.</p>

        <!-- Redirect URL -->
        <div id="redirect-section" class="hidden">
          <label for="input-redirect">Redirect To</label>
          <input id="input-redirect" type="text" placeholder="https://new-api.example.com/v2" />
        </div>

        <!-- Headers -->
        <div id="headers-section">
          <label>Headers</label>
          <div id="headers-list" class="headers-list"></div>
          <button type="button" id="btn-add-header" class="btn btn-ghost btn-sm">+ Add Header</button>
        </div>

        <!-- Method Filter -->
        <label>Methods (optional)</label>
        <div id="method-filter" class="method-filter">
          <label class="method-chip"><input type="checkbox" value="get" /> GET</label>
          <label class="method-chip"><input type="checkbox" value="post" /> POST</label>
          <label class="method-chip"><input type="checkbox" value="put" /> PUT</label>
          <label class="method-chip"><input type="checkbox" value="delete" /> DELETE</label>
          <label class="method-chip"><input type="checkbox" value="patch" /> PATCH</label>
          <label class="method-chip"><input type="checkbox" value="options" /> OPTIONS</label>
          <label class="method-chip"><input type="checkbox" value="head" /> HEAD</label>
        </div>
        <p class="hint">Leave unchecked to match all methods.</p>

        <!-- Form Actions -->
        <div class="form-actions">
          <button type="button" id="btn-cancel" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>

      </form>
    </div>
  </div>

  <!-- COMPARISON OVERLAY -->
  <div id="compare-overlay" class="compare-overlay hidden">
    <div class="compare-panel">
      <div class="compare-header">
        <h2>Request Comparison</h2>
        <div class="compare-tabs">
          <button class="compare-tab-btn active" data-ctab="request">Request</button>
          <button class="compare-tab-btn" data-ctab="response">Response</button>
        </div>
        <button id="btn-close-compare" class="btn-icon" title="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div id="compare-tab-request" class="compare-content compare-tab-content active"></div>
      <div id="compare-tab-response" class="compare-content compare-tab-content hidden"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
