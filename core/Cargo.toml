[package]
name = "request-pilot-core"
version = "0.1.0"
edition = "2021"
description = "Request Pilot core library — HTTP parser, client, test runner"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7"] }
regex = "1"
rand = "0.8"
log = "0.4"
hostname = "0.4"
sha2 = "0.10"
